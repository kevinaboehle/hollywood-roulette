<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101018"><title>Hollywood Roulette</title><style>
:root{color-scheme:dark;font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 50% 0%,#343044 0%,#14131e 42%,#0d0d14 100%);color:#fff4db;display:flex;justify-content:center;padding:24px 16px 48px}.app{width:min(100%,480px);text-align:center}.eyebrow{color:#d9ad66;letter-spacing:.28em;font-size:11px;font-weight:700;margin:20px 0 8px}h1{font-family:Georgia,serif;font-size:clamp(34px,9vw,50px);font-weight:500;line-height:1.05;margin:0 0 8px}.sub{color:#b5aeb9;font-size:13px;margin-bottom:28px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);padding:5px;border:1px solid #4a3c44;border-radius:16px;background:#1d1b27;gap:4px}.tab{border:0;border-radius:11px;padding:13px 4px;color:#c9bec5;background:transparent;font-size:13px;font-weight:700}.tab.active{background:#e9b76f;color:#201722}.stage{position:relative;margin:28px 0 16px;border:1px solid #665039;border-radius:22px;background:linear-gradient(155deg,#29212d,#15131d 75%);min-height:255px;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 20px 60px #0007,inset 0 0 35px #f5bd5510}.stage:before,.stage:after{content:"";position:absolute;left:16px;right:16px;height:1px;background:linear-gradient(90deg,transparent,#9c7845,transparent)}.stage:before{top:17px}.stage:after{bottom:17px}.star{color:#d5a05b;font-size:22px;margin-bottom:22px}.name{font-family:Georgia,serif;font-size:clamp(30px,8vw,45px);line-height:1.1;padding:0 22px;min-height:100px;display:flex;align-items:center;justify-content:center;overflow-wrap:anywhere}.hint{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#b6a0a0;margin-top:16px}.spinning .name{filter:blur(.65px)}.spin{width:100%;padding:19px;border:0;border-radius:16px;background:linear-gradient(180deg,#f5cc86,#db9d4d);color:#28190e;font-size:17px;font-weight:850;letter-spacing:.13em;box-shadow:0 6px 24px #c88d4938}.spin:disabled{opacity:.65}.options{display:flex;justify-content:space-between;gap:12px;margin:18px 0 24px;color:#d5c8c4;font-size:13px}.options label{display:flex;align-items:center;gap:7px}.options input{accent-color:#e6b16c}.history{text-align:left;border-top:1px solid #4d3b3d;padding-top:18px}.history-head{display:flex;justify-content:space-between;align-items:center}.history h2{font-size:13px;letter-spacing:.16em;color:#d4b387;margin:0}.clear{background:none;border:0;color:#b9a6a9;text-decoration:underline;font-size:12px}ol{padding-left:26px;color:#dfd3ce;line-height:2;font-size:14px;margin:12px 0}li span{float:right;color:#998b91;font-size:11px}.empty{font-size:13px;color:#998b91}.foot{font-size:11px;color:#8f838e;margin-top:26px;line-height:1.6}button{cursor:pointer}button:focus-visible{outline:3px solid white;outline-offset:3px}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style></head><body><main class="app"><div class="eyebrow">★ THE CASTING ROOM ★</div><h1>Hollywood<br>Roulette</h1><div class="sub">200 iconic performers. One random pick.</div><div class="tabs" role="group" aria-label="Selection pool"><button class="tab active" data-pool="actors">Actors · 100</button><button class="tab" data-pool="actresses">Actresses · 100</button><button class="tab" data-pool="all">Everyone · 200</button></div><section class="stage" id="stage" aria-live="off"><div class="star">✦ ✧ ✦</div><div class="name" id="name" aria-live="polite">Your next star awaits</div><div class="hint" id="hint">Ready for the spotlight</div></section><button class="spin" id="spin">✦ SPIN THE NAMES ✦</button><div class="options"><label><input id="unique" type="checkbox"> Avoid repeats until reset</label><span id="remaining"></span></div><section class="history"><div class="history-head"><h2>RECENT PICKS</h2><button class="clear" id="clear">Clear history</button></div><div id="history" class="empty">No picks yet.</div></section><p class="foot">An editorial, unranked selection of acclaimed performers across eras and countries. All selections are equally likely. Works offline.</p></main><script>
const actors=["Marlon Brando", "Daniel Day-Lewis", "Robert De Niro", "Al Pacino", "Jack Nicholson", "Denzel Washington", "Anthony Hopkins", "Laurence Olivier", "Toshiro Mifune", "James Stewart", "Cary Grant", "Humphrey Bogart", "Charlie Chaplin", "Buster Keaton", "Orson Welles", "Spencer Tracy", "Sidney Poitier", "Paul Newman", "Gene Hackman", "Dustin Hoffman", "Robert Duvall", "Morgan Freeman", "Michael Caine", "Peter O'Toole", "Richard Burton", "Alec Guinness", "Max von Sydow", "Marcello Mastroianni", "Jean Gabin", "Jean-Paul Belmondo", "Alain Delon", "Klaus Kinski", "Bruno Ganz", "Gian Maria Volonté", "Takeshi Kitano", "Ken Takakura", "Tony Leung Chiu-wai", "Chow Yun-fat", "Song Kang-ho", "Choi Min-sik", "Irrfan Khan", "Naseeruddin Shah", "Amitabh Bachchan", "Shah Rukh Khan", "Aamir Khan", "Om Puri", "Soumitra Chatterjee", "Takashi Shimura", "Koji Yakusho", "Hiroyuki Sanada", "Joaquin Phoenix", "Leonardo DiCaprio", "Christian Bale", "Gary Oldman", "Philip Seymour Hoffman", "Ralph Fiennes", "Willem Dafoe", "Samuel L. Jackson", "Forest Whitaker", "Jeff Bridges", "Tom Hanks", "Brad Pitt", "George Clooney", "Matt Damon", "Edward Norton", "Sean Penn", "Javier Bardem", "Antonio Banderas", "Benicio del Toro", "Gael García Bernal", "Diego Luna", "Ricardo Darín", "Wagner Moura", "Mads Mikkelsen", "Christoph Waltz", "Colin Farrell", "Cillian Murphy", "Andrew Scott", "Benedict Cumberbatch", "Tom Hardy", "Adam Driver", "Oscar Isaac", "Mahershala Ali", "Michael B. Jordan", "Ethan Hawke", "Jake Gyllenhaal", "Ryan Gosling", "Heath Ledger", "Robin Williams", "Jim Carrey", "Steve Martin", "Bill Murray", "John Candy", "Peter Sellers", "Jack Lemmon", "Walter Matthau", "Fred Astaire", "Gregory Peck", "Burt Lancaster", "Kirk Douglas"];const actresses=["Meryl Streep", "Katharine Hepburn", "Bette Davis", "Ingrid Bergman", "Viola Davis", "Cate Blanchett", "Frances McDormand", "Judi Dench", "Maggie Smith", "Helen Mirren", "Glenn Close", "Jessica Lange", "Jane Fonda", "Sissy Spacek", "Ellen Burstyn", "Gena Rowlands", "Liv Ullmann", "Isabelle Huppert", "Juliette Binoche", "Jeanne Moreau", "Catherine Deneuve", "Anna Magnani", "Sophia Loren", "Giulietta Masina", "Monica Vitti", "Marion Cotillard", "Emmanuelle Riva", "Delphine Seyrig", "Simone Signoret", "Anouk Aimée", "Audrey Hepburn", "Elizabeth Taylor", "Vivien Leigh", "Greta Garbo", "Marlene Dietrich", "Joan Crawford", "Barbara Stanwyck", "Carole Lombard", "Claudette Colbert", "Olivia de Havilland", "Deborah Kerr", "Grace Kelly", "Judy Garland", "Shirley MacLaine", "Julie Andrews", "Rita Moreno", "Cicely Tyson", "Ruby Dee", "Angela Bassett", "Whoopi Goldberg", "Halle Berry", "Regina King", "Octavia Spencer", "Lupita Nyong'o", "Danai Gurira", "Thandiwe Newton", "Naomie Harris", "Michelle Yeoh", "Maggie Cheung", "Gong Li", "Zhang Ziyi", "Tang Wei", "Rinko Kikuchi", "Setsuko Hara", "Hideko Takamine", "Kinuyo Tanaka", "Sakura Ando", "Bae Doona", "Kim Hye-ja", "Youn Yuh-jung", "Deepika Padukone", "Tabu", "Shabana Azmi", "Smita Patil", "Waheeda Rehman", "Nandita Das", "Aishwarya Rai Bachchan", "Penélope Cruz", "Salma Hayek", "Fernanda Montenegro", "Sônia Braga", "Dolores del Río", "María Félix", "Yalitza Aparicio", "Natalie Portman", "Nicole Kidman", "Julianne Moore", "Kate Winslet", "Amy Adams", "Tilda Swinton", "Laura Dern", "Michelle Williams", "Saoirse Ronan", "Emma Stone", "Scarlett Johansson", "Jennifer Lawrence", "Anne Hathaway", "Kirsten Dunst", "Margot Robbie", "Greta Lee"];const all=[...actors,...actresses];let pool='actors',spinning=false;const $=id=>document.getElementById(id);let history=[],used=[];try{history=JSON.parse(localStorage.getItem('hr-history')||'[]');used=JSON.parse(localStorage.getItem('hr-used')||'[]')}catch(e){}const save=()=>{try{localStorage.setItem('hr-history',JSON.stringify(history));localStorage.setItem('hr-used',JSON.stringify(used))}catch(e){}};function candidates(){const base=pool==='actors'?actors:pool==='actresses'?actresses:all;return $('unique').checked?base.filter(n=>!used.includes(n)):base}function pick(a){return a[Math.floor(Math.random()*a.length)]}function update(){document.querySelectorAll('.tab').forEach(b=>{b.classList.toggle('active',b.dataset.pool===pool);b.setAttribute('aria-pressed',String(b.dataset.pool===pool))});const base=pool==='actors'?actors:pool==='actresses'?actresses:all;$('remaining').textContent=$('unique').checked?`${candidates().length} / ${base.length} left`:''; $('history').innerHTML=history.length?'<ol>'+history.slice(0,12).map(h=>'<li>'+h.name+' <span>'+h.pool+'</span></li>').join('')+'</ol>':'No picks yet.'}document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{if(spinning)return;pool=b.dataset.pool;update()}));$('unique').addEventListener('change',update);$('clear').addEventListener('click',()=>{if(spinning)return;history=[];used=[];save();update();$('hint').textContent='History reset'});$('spin').addEventListener('click',()=>{if(spinning)return;let available=candidates();if(!available.length){used=[];available=candidates();$('hint').textContent='All names used — starting a new round'}const winner=pick(available);spinning=true;$('spin').disabled=true;$('spin').textContent='CASTING IN PROGRESS…';$('stage').classList.add('spinning');$('hint').textContent='The names are rolling';const base=pool==='actors'?actors:pool==='actresses'?actresses:all;const start=performance.now(),duration=3100;let last=0;function frame(now){const t=Math.min(1,(now-start)/duration);const interval=45+Math.pow(t,3)*420;if(now-last>=interval&&t<1){$('name').textContent=pick(base);last=now}if(t<1){requestAnimationFrame(frame)}else{$('name').textContent=winner;$('stage').classList.remove('spinning');$('hint').textContent='✦ YOUR STAR IS CAST ✦';history.unshift({name:winner,pool:pool==='all'?'Everyone':pool==='actors'?'Actor':'Actress'});used.push(winner);save();spinning=false;$('spin').disabled=false;$('spin').textContent='✦ SPIN AGAIN ✦';update()}}requestAnimationFrame(frame)});update();
</script></body></html>
